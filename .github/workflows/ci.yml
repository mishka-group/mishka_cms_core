name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Switch to @ci-v1 once mishka-group/mishka_cms#77 is merged and tagged.
    uses: mishka-group/mishka_cms/.github/workflows/mishka-ci.yml@ci-v1
    with:
      postgres: true
      partitions: 4
      pre-test: |
        mix ash.codegen ci
        mix localize.download_locales fa
      tailwind-cache: true
      credence-task: mishka_cms_core.credence
      sobelow: true
      ex-dna-args: "--max-clones 92"
      assets: true
      bun-version: "1.4.4"
