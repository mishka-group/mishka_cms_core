name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch or pull request makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # TEMPORARY: OTP 29.0.5, not the 29.1.x of .tool-versions, in every job and every cache key
  # below. From OTP 29.0.6 on, :httpc stops at 10240 bytes of response headers by default, and the
  # redirect GitHub answers a release download with now carries about 10.8 KB of them, so precompiled
  # NIFs and binaries downloaded through :httpc (elixir_make, cc_precompiler, rustler_precompiled,
  # tailwind) fail with {:header_too_long, {:max, 10240}}. Move back to the latest OTP, with
  # `version-file: .tool-versions` and .tool-versions in the cache keys again, once a fixed OTP
  # release or fixed libraries are out.
  OTP_VERSION: "29.0.5"
  ELIXIR_VERSION: "1.20.4-otp-29"
  # setup-beam installs Hex from builds.hex.pm, and one slow response there failed a whole run
  # ("Could not mix hex from any hex.pm mirror"). It tries these in order.
  HEXPM_MIRRORS: |
    https://builds.hex.pm
    https://cdn.jsdelivr.net/hex

jobs:
  # Compiled once; the jobs below start from this build.
  #
  # A cache entry can never be changed once saved, so the key carries the commit: each run saves the
  # build it made, and the next one starts from the nearest one before it (`restore-keys`) and
  # compiles only what changed. Keyed on mix.lock alone, the first build ever saved was restored
  # forever and every run compiled the whole project again.
  build:
    runs-on: ubuntu-latest

    steps:
      # Only this repository. mishka_gervaz comes from Hex, and mix.exs would use a ../mishka_gervaz
      # checkout over Hex if it found one, so no sibling is ever checked out here.
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict
          hexpm-mirrors: ${{ env.HEXPM_MIRRORS }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-mix-${{ hashFiles('mix.lock') }}-

      - run: mix deps.get

      - run: MIX_ENV=test mix compile --warnings-as-errors

  # Beside the tests rather than in front of them.
  format:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict
          hexpm-mirrors: ${{ env.HEXPM_MIRRORS }}

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true

      # The formatter takes the DSL's paren-free calls (`table "pages"`, `reference :site, ...`)
      # from the dependencies in .formatter.exs's import_deps, so it runs once they are fetched.
      - run: MIX_ENV=test mix format --check-formatted

  # FOUR MACHINES, A QUARTER OF THE TEST FILES EACH. Three quarters of the suite is `async: false` —
  # it shares the runtime's global state — and runs one module at a time, so more cores do not make
  # it faster and more machines do. Mix deals the test files out by `--partitions`, and each
  # partition has its own Postgres and its own database (`config/test.exs` names it after
  # MIX_TEST_PARTITION).
  test:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      POSTGRES_HOST: localhost
      MIX_TEST_PARTITION: ${{ matrix.partition }}

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict
          hexpm-mirrors: ${{ env.HEXPM_MIRRORS }}

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true

      # The migrations are generated, not in git: generate them before the test alias's `ash.setup`
      # migrates the test database.
      - run: MIX_ENV=test mix ash.codegen ci

      # The CLDR data the tests read in a language other than English, downloaded once here rather
      # than by four partitions at the same time.
      - run: MIX_ENV=test mix localize.download_locales fa

      # `mix test`, not `MIX_ENV=test mix test`: mishka_installer decides at dep-compile time
      # whether to start its plugin engine, and an exported MIX_ENV outranks the `project_env`
      # override in config/test.exs. --warnings-as-errors also fails on warnings in the test files,
      # each in the partition that compiles it.
      - run: mix test --warnings-as-errors --partitions 4
