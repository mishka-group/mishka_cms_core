<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The fonts MishkaCmsCore.Runtime.ShareCard draws with: the ones beside this file first, then the
     system's for any script they do not cover. A folder that is not there is skipped. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <cachedir prefix="xdg">mishka-cms-fontconfig</cachedir>
</fontconfig>
